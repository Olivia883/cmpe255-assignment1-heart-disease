<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dynamic Todo Workspace</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <h1>Dynamic Todo Workspace</h1>

    <form id="task-form">
      <input id="task-title" placeholder="Add a task..." required>
      <button>Add Task</button>
    </form>

    <div class="stats">
      <span id="total">Total: 0</span>
      <span id="done">Done: 0</span>
      <span id="open">Open: 0</span>
    </div>

    <ul id="tasks"></ul>
  </main>

  <script src="/app.js"></script>
</body>
</html>
